<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>AI 模式 · 測試頁</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #131314; color: #e3e3e3; min-height: 100vh;
    font: 14px/1.5 "Noto Sans TC", system-ui, sans-serif;
  }
  /* 故意學 Google：整頁包在一個全寬的 #main 裡，裡面才是側邊欄 + 對話區 */
  #main { display: flex; align-items: flex-start; min-height: 100vh; }
  .rail {
    width: 340px; min-height: 100vh; background: #1b1c1f;
    padding: 12px 10px; flex: 0 0 auto;
  }
  .brand { font-size: 22px; padding: 6px 10px 18px; color: #e8eaed; letter-spacing: -.5px; }
  .navitem {
    display: flex; align-items: center; gap: 12px; height: 40px;
    padding: 0 12px; border-radius: 22px; cursor: pointer; color: #c4c7c5;
  }
  .navitem:hover { background: #2a2d31; }
  .cap { font-size: 11px; color: #8e918f; padding: 14px 12px 6px; letter-spacing: .06em; }
  .threads { display: flex; flex-direction: column; gap: 1px; padding-top: 4px; }
  .thread {
    display: flex; align-items: center; gap: 8px; height: 44px;
    padding: 0 8px 0 12px; border-radius: 10px; color: #d5d8dc;
  }
  .thread:hover { background: #282b2f; }
  .thread.sel { background: #2f3238; }
  /* 學 Google：外層 div 只是排版，真正可以點的是裡面那顆 button */
  .open {
    flex: 1 1 auto; min-width: 0; display: block; text-align: left;
    background: transparent; border: 0; padding: 0; color: inherit;
    font: inherit; cursor: pointer; overflow: hidden;
  }
  .open[aria-current="true"] .ttl { color: #eef1f5; font-weight: 600; }
  .ico { width: 16px; height: 16px; flex: 0 0 auto; opacity: .65; font-size: 12px; }
  .ttl { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more {
    width: 28px; height: 28px; flex: 0 0 auto; border: 0; border-radius: 50%;
    background: transparent; color: #c4c7c5; cursor: pointer; opacity: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .thread:hover .more { opacity: 1; }
  .more:hover { background: #3c4043; }
  .more svg { width: 16px; height: 16px; fill: currentColor; }

  .menu {
    position: absolute; z-index: 1000; width: 170px; background: #2b2d31;
    border: 1px solid #3c4046; border-radius: 12px; padding: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,.6);
  }
  .menu [role=menuitem] { padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .menu [role=menuitem]:hover { background: #3a3d42; }
  .menu [role=menuitem].del { color: #ff9aa2; }

  .dlg {
    position: fixed; inset: 0; z-index: 2000; margin: auto; width: 340px; height: 160px;
    background: #23262a; border: 1px solid #3c4046; border-radius: 16px; padding: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.7);
  }
  .dt { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .dsub { font-size: 12px; color: #a8adb4; }
  .db { display: flex; justify-content: flex-end; gap: 8px; margin-top: 42px; }
  .db button { padding: 7px 16px; border-radius: 18px; border: 1px solid #4a4e55; background: transparent; color: #d5d8dc; cursor: pointer; }
  .db button.ok { background: #a8c7fa; border-color: #a8c7fa; color: #0b0c0e; font-weight: 700; }

  .conv { flex: 1 1 auto; padding: 28px 40px; color: #cfd3d9; font-size: 13px; line-height: 1.8; }
  .ph { color: #6f747b; }
  .q { background: #23262b; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; color: #b9bec6; }
  .a p { margin-bottom: 12px; }
  .a a { color: #a8c7fa; }
  .a h2 { font-size: 20px; margin: 14px 0 10px; color: #f0f2f5; }
  /* 學 Google 的來源卡片：標籤 + 橫向捲動的一排卡片（favicon + 標題 + 網域） */
  .srcs { margin-top: 18px; padding-top: 12px; border-top: 1px solid #2c2f34; }
  .srclabel { font-size: 12px; color: #8b9098; margin-bottom: 8px; }
  .srcrow { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .card {
    display: flex; flex-direction: column; gap: 4px; flex: 0 0 190px;
    background: #1e2126; border: 1px solid #2c3036; border-radius: 12px;
    padding: 10px 12px; text-decoration: none; color: #cfd3d9;
  }
  .card .fav { width: 14px; height: 14px; border-radius: 3px; background: #3c4043; }
  .card .ct { font-size: 12px; line-height: 1.5; color: #dfe3e8; }
  .card .cd { font-size: 11px; color: #8b9098; }
  /* 旁邊的贊助廣告 */
  .adbox { display: flex; flex-direction: column; gap: 6px; background: #1d2024; border: 1px solid #31353b;
           border-radius: 12px; padding: 10px 12px; margin: 14px 0; }
  .adbadge { align-self: flex-start; font-size: 10px; padding: 1px 6px; border-radius: 4px;
             background: #2d3238; color: #9aa0a6; }
  .adbanner { width: 100%; height: 8px; border-radius: 4px; background: #30353b; }
  .adt { font-size: 13px; color: #e6e9ee; font-weight: 600; }
  .adsub { font-size: 12px; color: #9aa0a6; }
  .adslot { background: #262a2f; border-radius: 10px; padding: 10px 12px; margin: 14px 0;
            font-size: 12px; color: #c9ced6; }
  /* 右欄那種卡片：外殼是一個沒有文字、只有 aria-label 的 <a>（實際頁面的結構） */
  .rightrail { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .rcard { position: relative; background: #1c1f23; border: 1px solid #2b2f35; border-radius: 12px;
           padding: 10px 12px; }
  .vcob { position: absolute; inset: 0; display: block; }
  .rsite { font-size: 11px; color: #9aa0a6; margin-bottom: 3px; }
  .rtitle { font-size: 12.5px; color: #dfe3e8; margin-bottom: 3px; }
  .rsnip { font-size: 11.5px; color: #9aa0a6; line-height: 1.6; }
  .rfav { width: 14px; height: 14px; border-radius: 3px; background: #3c4043; }
  /* 來源面板：ul > li > div[data-src-id] */
  .srcpanel { margin: 16px 0; border: 1px solid #2b2f35; border-radius: 12px; padding: 8px; }
  .slist { list-style: none; }
  .scard { position: relative; padding: 9px 10px; border-bottom: 1px solid #262a2f; }
  .sfav { width: 14px; height: 14px; border-radius: 3px; background: #3c4043; }
  .ssite { font-size: 11px; color: #9aa0a6; }
  .stitle { font-size: 12.5px; color: #dfe3e8; font-weight: 600; }
  .ssnip { font-size: 11.5px; color: #9aa0a6; }
  .showall { width: 100%; margin-top: 8px; padding: 7px; border-radius: 18px;
             background: #2a2d33; color: #d6d9de; font-size: 12px; border: 1px solid #35383e; }
  /* 回答下方那排小圖示（結束標記） */
  .acts { display: flex; gap: 8px; margin: 12px 0 4px; }
  .act { width: 26px; height: 26px; border-radius: 50%; background: #2a2d33; border: 1px solid #35383e; }
  .counter { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #5c6169; }
</style>
</head>
<body>
  <div id="main">
  <div class="rail" role="navigation" aria-label="主要導覽">
    <div class="brand">Google</div>
    <div class="navitem" role="button" tabindex="0">✎ 新增對話串</div>
    <div class="navitem" role="button" tabindex="0">🔍 搜尋討論串</div>

    <div class="cap">筆記</div>
    <div class="navitem" role="button" tabindex="0">＋ 新增筆記本</div>
    <div class="navitem" role="button" tabindex="0">▤ 我的筆記本</div>

    <div class="cap">最近的討論串</div>
    <div class="threads" id="threads"></div>
  </div>

  <section class="conv" id="conv">
    <div class="ph">點左邊任何一個討論串，這裡就會顯示內容。</div>
  </section>
  </div>

  <div class="counter">剩下 <b id="left">0</b> 個討論串</div>

<script>
  const TITLES = [
    '週末露營裝備清單',
    '筆記軟體比較',
    '伺服器搬遷步驟',
    '模型參數調整',
    '動畫角色設定查詢',
    '程式碼審查流程',
    '顯示卡選購建議',
    '租約到期注意事項',
    '週末露營裝備清單'
  ];

  const dots = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>';

  const wrap = document.getElementById('threads');
  TITLES.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'thread';
    row.setAttribute('role', 'presentation');
    row.dataset.id = 't' + i;
    row.innerHTML =
      '<span class="ico">💬</span>' +
      '<button class="open" type="button" data-thread-id="t' + i + '" aria-label="' + t + '，第 ' + (i + 1) + ' 項 (共 ' + TITLES.length + ' 項)">' +
        '<span class="ttl"></span>' +
      '</button>' +
      '<button class="more" aria-label="「' + t + '」的其他選項">' + dots + '</button>';
    row.querySelector('.ttl').textContent = t;
    row.querySelector('.open').addEventListener('click', () => showConv(row));
    wrap.append(row);
  });

  const left = document.getElementById('left');
  const sync = () => { left.textContent = wrap.children.length; };
  sync();

  /* 點一列 → 右邊換成那一篇的內容（模擬 AI 模式切換討論串） */
  const conv = document.getElementById('conv');
  const FAV = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  const REDIR = 'https://www.google.com/url?sa=t&source=web&q=';
  function srcCard(title, domain, href) {
    // 真的 Google 是給跳轉網址 不是原始網址
    return '<a class="card" href="' + REDIR + encodeURIComponent(href) + '" target="_blank" rel="noopener">' +
      '<img class="fav" alt="" src="' + FAV + '">' +
      '<span class="ct">' + title + '</span>' +
      '<span class="cd">' + domain + '</span>' +
      '</a>';
  }
  function srcCardNoLink(title, domain) {
    // 有些版本沒有 <a> 只用 role="link"
    return '<div class="card" role="link" tabindex="0">' +
      '<img class="fav" alt="" src="' + FAV + '">' +
      '<span class="ct">' + title + '</span>' +
      '<span class="cd">' + domain + '</span>' +
      '</div>';
  }
  // 右欄卡片：<a> 本身沒有文字 只有 aria-label 文字全在兄弟節點
  function railCard(site, title, snip, href) {
    return '<div class="rcard">' +
      '<a class="vcob" data-link-behavior="cobrowse" target="_blank" rel="noopener" aria-label="' + title + '"' +
        ' href="' + href + '"></a>' +
      '<img class="rfav" alt="" src="' + FAV + '">' +
      '<div class="rsite">' + site + '</div>' +
      '<div class="rtitle">' + title + '</div>' +
      '<div class="rsnip">' + snip + '</div>' +
      '</div>';
  }
  // 來源面板：ul > li > div[data-src-id]，<a aria-label="短站名">（站名只有 3 個字，用來考驗判斷規則）
  function srcPanelCard(site, title, snip, href) {
    return '<li><div class="scard" data-src-id="1" data-src-fp="false" data-crb-el="kXllB">' +
      '<a class="vcob" data-link-behavior="cobrowse" target="_blank" rel="noopener" aria-label="' + site + '"' +
        ' href="' + href + '"></a>' +
      '<img class="sfav" alt="" src="' + FAV + '">' +
      '<div class="ssite">' + site + '</div>' +
      '<div class="stitle">' + title + '</div>' +
      '<div class="ssnip">' + snip + '</div>' +
      '</div></li>';
  }
  function actsRow() {
    // 回答結束時才會出現的那排小圖示（讚 分享 朗讀）
    return '<div class="acts">' +
      '<button class="act" type="button" aria-label="分享"></button>' +
      '<button class="act" type="button" aria-label="朗讀"></button>' +
      '</div>';
  }
  function longTail(id) {
    let s = '';
    for (let i = 0; i < 12; i++) s += '<p>長回答的第 ' + (i + 1) + ' 段，用來測試延遲渲染不會被截斷。</p>';
    return s + '<p>TAIL_' + id + ' 這是長文的尾巴。</p>';
  }
  function showConv(row) {
    const title = row.querySelector('.ttl').textContent;
    const id = row.dataset.id;
    conv.innerHTML =
      '<div class="q">你：幫我整理「' + title + '」</div>' +
      '<div class="a">' +
        '<p>這是「' + title + '」的整理，標記 MARKER_' + id + '。</p>' +
        '<h2>重點整理</h2>' +
        '<p>重點一：先把需求拆成幾個小步驟，才知道要先動哪裡。</p>' +
        '<p>重點二：每一步都要能驗證，不然最後會不知道是哪一步壞的。</p>' +
        '<p>延伸閱讀可以看 <a href="https://example.com/guide">這篇說明</a>，裡面有更多細節跟範例。</p>' +
        '<p>网友补充：这个线程讨论得很清楚，适配器也很好用，值得参考。</p>' +
        /* 旁邊的贊助廣告 不該進檔案 */
        '<div class="adbox">' +
          '<span class="adbadge">贊助</span>' +
          '<img class="adbanner" alt="" src="' + FAV + '">' +
          '<div class="adt">Genspark 免費無限使用</div>' +
          '<div class="adsub">免費使用 Nano Banana Pro 頂級模型 立即體驗</div>' +
        '</div>' +
        '<div class="adslot" aria-label="廣告">買一送一 限時優惠 錯過不再</div>' +
        '<div class="srcs">' +
          '<div class="srclabel">來源</div>' +
          '<div class="srcrow">' +
            srcCard('示例文章：如何编写适配器 - 示例博客', 'cloud.tencent.com', 'https://cloud.tencent.com/developer/article/1') +
            srcCard('Getting started with adapters - Example Docs', 'github.com', 'https://github.com/docs/adapter') +
            srcCardNoLink('任务管理的最佳实践', 'example.org') +
            srcCardNoLink('退租時要歸還哪些設備', 'example.com') +
          '</div>' +
        '</div>' +
        '<div class="rightrail">' +
          railCard('範例網路服務商',
            '數位有線電視- 影視娛樂| 寬頻上網、光纖上網 - 範例網路服務商',
            '申請數位服務用戶可付押借用數位機上盒設備,需收取保證金1,000元。繳付之保證金於用戶退租歸還數位機上盒後無息歸還(數位機上盒租借費用',
            'https://example.net/cable/services') +
          railCard('範例論壇',
            '請問關於申請第二台機上盒的費用 - 範例論壇',
            '家中有線電視業者 … 時歸還。第二臺收800元,退租時不會退回因為不是押金對方稱收視費。',
            'https://example.org/forum/topic?id=123') +
          railCard('Example Provider',
            'What are the items that I need to return?',
            'For customers with the standard or premium box, you are required to return only the A',
            'https://example.com/help/return') +
        '</div>' +
        '<div class="srcpanel">' +
          '<ul class="slist">' +
            srcPanelCard('示例站', '示例技术报告 Example Technical Report',
              '* Blog. * Publication. * About. * Try Example Chat. ... Performance. ... Below we present the comprehensive evaluation of our models against frontier',
              'https://example.ai/blog?id=1') +
            srcPanelCard('arXtv.org', '[2604.15804] 示例技术报告 Example Technical Report',
              '[2604.15804] 示例技术报告 Example Technical Report. ... Table_title: 示例技术报告 Example Technical Report Table_conte...',
              'https://example.org/abs/0000.00000') +
            srcPanelCard('示例文檔', '示例模型服务平台文档 - 示例云文档',
              '大模型服務平台百煉 * 視覺智能開放平台（文檔停止維護） 自然語言處理 * 自然語言處理 ...',
              'https://example.com/docs/model-service') +
          '</ul>' +
          '<button class="showall" type="button">顯示全部</button>' +
        '</div>' +
        (id === 't2' ? '' : actsRow() + longTail(id)) +
      '</div>';

    // t2：模擬「長文延遲渲染」——先給標題 內文 900ms 後才畫 結束鈕也是最後才出現
    if (id === 't2') {
      const box = conv.querySelector('.a');
      setTimeout(() => {
        if (wrap.dataset.cur !== id || !box || !box.isConnected) return;
        box.insertAdjacentHTML('beforeend', longTail(id) + actsRow());
      }, 900);
    }
    wrap.dataset.cur = id;

    document.querySelectorAll('.thread .open').forEach((b) => {
      if (b === row.querySelector('.open')) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });
  }

  function closeMenu() {
    document.querySelectorAll('.menu').forEach((m) => m.remove());
  }

  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.more');
    if (!btn) return;
    e.stopPropagation();
    closeMenu();
    const row = btn.closest('.thread');
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.setAttribute('role', 'menu');
    menu.innerHTML =
      '<div role="menuitem">重新命名</div>' +
      '<div role="menuitem">分享</div>' +
      '<div role="menuitem" class="del">刪除</div>';
    document.body.append(menu);
    const r = btn.getBoundingClientRect();
    menu.style.left = (r.left - 150) + 'px';
    menu.style.top = (r.bottom + 4) + 'px';

    menu.querySelectorAll('[role=menuitem]').forEach((it) => {
      it.addEventListener('click', () => {
        const isDel = it.classList.contains('del');
        closeMenu();
        if (isDel) openConfirm(row);
      });
    });
  });

  function openConfirm(row) {
    const d = document.createElement('div');
    d.className = 'dlg';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.innerHTML =
      '<div class="dt">刪除討論串？</div>' +
      '<div class="dsub">刪除後就無法復原。</div>' +
      '<div class="db"><button type="button">取消</button><button type="button" class="ok">刪除</button></div>';
    document.body.append(d);
    d.querySelector('.ok').addEventListener('click', () => {
      row.remove();
      d.remove();
      sync();
    });
    d.querySelector('button').addEventListener('click', () => d.remove());
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu') && !e.target.closest('.more')) closeMenu();
  });
</script>
</body>
</html>
